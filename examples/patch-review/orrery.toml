api = "orrery-ext/1"
runtime = "process"

[extension]
id = "example-patch-review"
version = "0.1.0"

[provides]
tools = ["review"]

# The patch is handed to it. Reading the file from disk would be a `read` grant
# and a different tool; describing a patch needs nothing.
[requires]

# Its own process (decision 0066 §1): the executable beside this file, on the
# per-spawn pipe.
[process]
command = "./patch-review"
channel = "pipe"
