api = "orrery-ext/1"
runtime = "process"

[extension]
id = "example-release-train"
version = "0.1.0"

[provides]
tools = ["status"]

# It describes the state it is given. A release train that could push would be
# asking for `spawn`; this one reports.
[requires]

# Its own process (decision 0066 §1): the executable beside this file, on the
# per-spawn pipe.
[process]
command = "./release-train"
channel = "pipe"
